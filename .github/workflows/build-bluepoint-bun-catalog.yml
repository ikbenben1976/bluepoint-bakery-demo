name: REJECTED prototype - inspect only, never publish

# Manual exploration only: output was rejected in visual QA on 2026-11-14.
# Never auto-commit generated extractions to the live site.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install photo extraction dependencies
        run: python -m pip install "pillow>=11,<13" "numpy>=2,<3" "opencv-python-headless>=4.10,<5"
      - name: Build 22 individual bun and sandwich-roll paths from official Bluepoint photos
        run: python scripts/build-bluepoint-bun-catalog.py
      - name: Check real product images have consistent dimensions
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          files=list(Path("public/images/catalog/buns").glob("*.webp")) + list(Path("public/images/catalog/sandwich-rolls").glob("*.webp"))
          assert len(files)==22, f"Expected 22 SKU images; got {len(files)}"
          for f in files:
              with Image.open(f) as im:
                  assert im.size in [(960,720),(1254,1254)], (f, im.size)
          print("Checked",len(files),"product images")
          PY
      - name: Save image build artifacts for review
        uses: actions/upload-artifact@v4
        with:
          name: first-party-bread-catalog-assets
          path: public/images/catalog/
          retention-days: 30

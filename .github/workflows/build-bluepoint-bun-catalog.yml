name: Build first-party Bluepoint bun catalog photos

on:
  push:
    branches: [main]
    paths:
      - "scripts/build-bluepoint-bun-catalog.py"
      - ".github/workflows/build-bluepoint-bun-catalog.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install photo extraction dependencies
        run: python -m pip install "pillow>=11,<13" "numpy>=2,<3" "opencv-python-headless>=4.10,<5"
      - name: Build 15 individual catalog paths from official Bluepoint photos and provenance-preserving fallback artwork
        run: python scripts/build-bluepoint-bun-catalog.py
      - name: Check real product images have consistent dimensions
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          files=list(Path("public/images/catalog/buns").glob("*.webp"))
          assert len(files)==15, f"Expected 15 SKU images; got {len(files)}"
          for f in files:
              with Image.open(f) as im:
                  assert im.size in [(960,720),(1254,1254)], (f, im.size)
          print("Checked",len(files),"product images")
          PY
      - name: Commit image assets to main without touching other site pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/catalog/buns/
          if git diff --cached --quiet; then
            echo "No image changes"
          else
            git commit -m "Add cleaned original Bluepoint bun product images with unique SKU URLs"
            git push origin HEAD:main
          fi
      - name: Save image build artifacts for review
        uses: actions/upload-artifact@v4
        with:
          name: first-party-bun-catalog-assets
          path: public/images/catalog/buns/
          retention-days: 30
